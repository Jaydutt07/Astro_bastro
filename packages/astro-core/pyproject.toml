[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-astro-core"
version = "0.1.0"
description = "Deterministic Vedic astrology and numerology primitives for Trust Astro."
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["astro_core*"]
